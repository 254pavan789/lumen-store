<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f6f6f3" />
  <script>
    /* apply the saved / system theme before first paint (no flash) */
    (function () {
      var t = null;
      try { t = localStorage.getItem('lumen.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.documentElement.style.colorScheme = t;
    })();
  </script>
  <meta name="description" content="Lumen – everyday essentials with live inventory. Electronics, home, fashion, groceries and more." />
  <title>Lumen — Everyday essentials, live inventory</title>

  <link rel="stylesheet" href="/css/store.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
