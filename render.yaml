# Render Blueprint - one free web service running the whole app
# (Express + Python engine) from the Dockerfile.
# The database is external (TiDB Cloud Starter, free, MySQL-compatible):
# Render asks for DB_HOST / DB_USER / DB_PASSWORD when you create the Blueprint.
services:
  - type: web
    name: lumen-store
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: lumen_store
      - key: DB_SSL
        value: "true"
      - key: DB_CONNECT_TIMEOUT
        value: "15"
      - key: ENGINE_THREADS
        value: "4"
      - key: ENGINE_TIMEOUT_MS
        value: "20000"
      - key: LOW_STOCK_THRESHOLD
        value: "5"
